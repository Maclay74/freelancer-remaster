# CI disabled: restore this file to .github/workflows/ to enable it again.
name: Windows x86 Clang
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  portable-kernels:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install LLVM if unavailable
        shell: pwsh
        run: ./scripts/ci/ensure-llvm.ps1
      - name: Validate inventory and compare verified kernels in Release
        shell: pwsh
        run: |
          python scripts/assembly_inventory.py
          if ($LASTEXITCODE) { throw 'Assembly inventory is stale' }
          foreach ($kernel in 'rpc_server_quantize_comm', 'rpc_server_expand_hull', 'rpc_server_quantize_hull', 'rpc_update_narrow', 'rpc_update_receive', 'quat_conversion', 'x86_core_math', 'batch_transform', 'quat_nlerp', 'scalar_math', 'spline_add_portable', 'spline_subtract_portable', 'lua_number_classify', 'lua_constant_compare', 'rpc_add_item_fields', 'rpc_modify_item_fields', 'spline_scale_stored', 'lua_vector_copy', 'light_color_store', 'scene_ambient_store', 'material_wire_color', 'rpc_fire_pick_tier', 'rpc_fire_quantize_small', 'rpc_fire_quantize_medium', 'rpc_update_quantize', 'rpc_quantize127', 'rpc_quantize255', 'truncate_double', 'rpc_fire_expand_small', 'rpc_fire_expand_medium', 'rpc_expand127', 'rpc_expand255', 'rpc_expand_comm', 'texture_frame_copy', 'double_load_copy', 'lua_nonzero_double', 'scene_interpolation_complete', 'scene_nonzero_float', 'param_strict_less', 'scene_transpose', 'scene_read_column', 'server_vector_copy', 'scene_negate_vector', 'hermite_assignment', 'hermite_construction', 'lua_double_probe', 'lua_float_probe', 'spline_negate_stored', 'spline_double_stored', 'float_extended_storage', 'float_load_copy', 'wire_put_float', 'rpc_server_float_copy') {
            ./scripts/test-portable-kernel.ps1 -Test $kernel
          }
      - name: Upload kernel comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-kernel-comparisons
          path: out/tests/portability/**/results.txt
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install LLVM if unavailable
        shell: pwsh
        run: ./scripts/ci/ensure-llvm.ps1
      - name: Obtain private SDK prerequisite
        shell: pwsh
        env:
          SDK_URL: ${{ secrets.DX8_SDK_ARCHIVE_URL }}
          SDK_SHA256: ${{ vars.DX8_SDK_ARCHIVE_SHA256 }}
        run: |
          if (!$env:SDK_URL -or !$env:SDK_SHA256) {
            throw 'Configure DX8_SDK_ARCHIVE_URL (secret) and DX8_SDK_ARCHIVE_SHA256 (variable). Archive must contain include/ and lib/ from the DirectX 8.1 SDK. See docs/building-cmake.md.'
          }
          Invoke-WebRequest $env:SDK_URL -OutFile "$env:RUNNER_TEMP\dx8.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\dx8.zip" -Algorithm SHA256).Hash -ne $env:SDK_SHA256) { throw 'SDK hash mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\dx8.zip" -DestinationPath dx8
      - name: Build and stage
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration ${{ matrix.configuration }}
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-diagnostics-${{ matrix.configuration }}
          path: out/build/**/CMakeFiles/CMakeConfigureLog.yaml
